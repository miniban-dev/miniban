[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Braden Hitchcock"]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
miniban-core = { path = "crates/miniban-core" }
# `debug-embed` makes debug builds embed the files instead of reading them from disk at runtime.
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
